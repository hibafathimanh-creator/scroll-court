<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="courtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="#090A0F" />
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  
  <!-- Subtle scale of attention icon -->
  <!-- Center pillar -->
  <line x1="50" y1="24" x2="50" y2="76" stroke="url(#courtGrad)" stroke-width="3.5" stroke-linecap="round" />
  <!-- Base -->
  <line x1="34" y1="76" x2="66" y2="76" stroke="url(#courtGrad)" stroke-width="3.5" stroke-linecap="round" />
  <!-- Crossbar tilted slightly -->
  <line x1="24" y1="36" x2="76" y2="34" stroke="#F4F4F6" stroke-width="2.5" stroke-linecap="round" />
  <!-- Left pan (Attention) -->
  <line x1="24" y1="36" x2="20" y2="52" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
  <line x1="24" y1="36" x2="28" y2="52" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
  <path d="M16 52 Q24 58 32 52 Z" fill="url(#courtGrad)" opacity="0.9" />
  <!-- Right pan (Screen) -->
  <line x1="76" y1="34" x2="72" y2="50" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
  <line x1="76" y1="34" x2="80" y2="50" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
  <path d="M68 50 Q76 56 84 50 Z" fill="url(#courtGrad)" opacity="0.9" />
  
  <!-- Central pivot diamond -->
  <polygon points="50,22 53,25 50,28 47,25" fill="#38BDF8" />
</svg>
