<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#07080b">
  <meta name="description" content="SCROLL COURT — A bold digital-wellness platform designed to help people recognize, understand, and reduce doom scrolling. Your attention is on trial.">
  <title>SCROLL COURT — Your Attention Is On Trial</title>
  
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            court: {
              base: '#07080b',
              surface: 'rgba(17, 21, 31, 0.65)',
              gold: '#d4af37',
              indigo: '#6366f1',
              cyan: '#38bdf8'
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Stylesheet with tokens, luxury fonts, glassmorphism, animations -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#07080b] text-[#f5f5f7] min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white pb-20 lg:pb-0">

  <!-- Subtle Cinematic Film Grain Texture -->
  <div class="grain-overlay" aria-hidden="true"></div>

  <!-- Global Header & Courtroom Command Bar -->
  <header class="sticky top-0 z-40 bg-[#07080b]/85 backdrop-blur-xl border-b border-white/[0.08] transition-all">
    <div class="max-w-7xl mx-auto px-4 sm:px-8 h-18 py-3.5 flex items-center justify-between gap-4">
      
      <!-- Brand Logo -->
      <a href="#court" id="brandLogoLink" class="flex items-center gap-3 group cursor-pointer">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500/20 via-sky-500/20 to-zinc-900 border border-white/20 flex items-center justify-center p-1.5 shadow-sm group-hover:border-indigo-400/60 transition-all">
          <img src="assets/favicon.svg" alt="Scroll Court Logo" class="w-full h-full object-contain">
        </div>
        <div>
          <div class="font-serif tracking-widest text-base sm:text-lg font-semibold text-white group-hover:text-indigo-200 transition-colors flex items-center gap-2">
            <span>SCROLL COURT</span>
            <span class="text-[9px] font-mono font-normal px-1.5 py-0.5 rounded bg-white/5 border border-white/10 text-zinc-400">PRO</span>
          </div>
          <div class="text-[10px] font-mono tracking-wider text-zinc-500 uppercase -mt-0.5">
            YOUR ATTENTION IS ON TRIAL
          </div>
        </div>
      </a>

      <!-- Desktop Navigation Tabs -->
      <nav class="hidden lg:flex items-center gap-6 font-mono text-xs" aria-label="Main Navigation">
        <button class="nav-tab active font-medium py-1 cursor-pointer" data-nav-target="court">COURTROOM</button>
        <button class="nav-tab font-medium py-1 cursor-pointer" data-nav-target="detector">DETECTOR</button>
        <button class="nav-tab font-medium py-1 cursor-pointer" data-nav-target="mirror">ATTENTION MIRROR</button>
        <button class="nav-tab font-medium py-1 cursor-pointer" data-nav-target="casefile">CASE FILE</button>
        <button class="nav-tab font-medium py-1 cursor-pointer" data-nav-target="focus">COURT ORDERS</button>
        <button class="nav-tab font-medium py-1 cursor-pointer" data-nav-target="body">BODY SIGNALS</button>
        <button class="nav-tab font-medium py-1 cursor-pointer" data-nav-target="weekly">WEEKLY</button>
        <button class="nav-tab font-medium py-1 cursor-pointer" data-nav-target="privacy">PRIVACY</button>
      </nav>

      <!-- Right Header Actions (Audio, Shortcuts, Emergency Break) -->
      <div class="flex items-center gap-2.5 sm:gap-3">
        
        <!-- Audio Synth Toggle -->
        <button id="headerAudioToggle" class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-xs text-zinc-300 transition-colors cursor-pointer" title="Toggle Sound Feedback">
          🔊
        </button>

        <!-- Help & Shortcuts `?` -->
        <button id="btnHelpShortcuts" class="hidden sm:flex w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 items-center justify-center text-xs font-mono text-zinc-400 hover:text-white transition-colors cursor-pointer" title="Keyboard Directives (?)">
          ?
        </button>

        <!-- Emergency Scroll Break CTA -->
        <button id="emergencyBreakBtn" class="btn-emergency cursor-pointer">
          <span class="w-2 h-2 rounded-full bg-rose-400 animate-pulse"></span>
          <span class="hidden sm:inline">I'M STUCK SCROLLING</span>
          <span class="sm:hidden">STUCK</span>
        </button>

      </div>

    </div>
  </header>

  <!-- Dynamic Application Root Content Container -->
  <main id="mainAppContent" class="flex-1 w-full" role="main">
    <!-- Populated dynamically via js/app.js -->
  </main>

  <!-- Editorial Luxury Footer -->
  <footer class="mt-16 border-t border-white/[0.08] bg-[#050608]/90 py-12 px-4 sm:px-8 text-zinc-400">
    <div class="max-w-6xl mx-auto space-y-8">
      
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
        <div class="space-y-2">
          <div class="font-serif italic text-xl sm:text-2xl text-zinc-200">
            “THE COURT ISN'T HERE TO JUDGE YOU. IT'S HERE TO GIVE YOUR ATTENTION BACK.”
          </div>
          <p class="text-xs font-mono text-zinc-500">
            SCROLL COURT · RECOVERING HUMAN AGENCY IN AN ERA OF INFINITE ALGORITHMS
          </p>
        </div>

        <div class="flex flex-wrap items-center gap-4 text-xs font-mono">
          <button data-nav-target="reflection" class="hover:text-white transition-colors cursor-pointer">REFLECTION CHAMBERS</button>
          <span class="text-zinc-700">/</span>
          <button data-nav-target="hero" class="hover:text-white transition-colors cursor-pointer">HERO MANIFESTO</button>
          <span class="text-zinc-700">/</span>
          <button data-nav-target="privacy" class="hover:text-white transition-colors cursor-pointer">DATA IS YOURS</button>
        </div>
      </div>

      <div class="pt-6 border-t border-white/5 flex flex-col sm:flex-row items-center justify-between text-[11px] font-mono text-zinc-500 gap-3">
        <div>
          ZERO SURVEILLANCE · NO TRACKING ADS · 100% CLIENT ENCRYPTED
        </div>
        <div>
          HOTKEYS: <kbd class="px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-300">1-5</kbd> TABS · <kbd class="px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-300">E</kbd> EMERGENCY · <kbd class="px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-300">?</kbd> HELP
        </div>
      </div>

    </div>
  </footer>

  <!-- Mobile Bottom Navigation Dock (Apple Health-Tech Thumb Friendly) -->
  <nav class="mobile-nav-bar font-mono text-[10px]" aria-label="Mobile Navigation">
    <button class="mobile-nav-item flex flex-col items-center gap-1 cursor-pointer" data-nav-target="hero">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>HOME</span>
    </button>
    <button class="mobile-nav-item flex flex-col items-center gap-1 cursor-pointer text-indigo-400" data-nav-target="court">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/></svg>
      <span>COURT</span>
    </button>
    <button class="mobile-nav-item flex flex-col items-center gap-1 cursor-pointer" data-nav-target="detector">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      <span>INSIGHTS</span>
    </button>
    <button class="mobile-nav-item flex flex-col items-center gap-1 cursor-pointer" data-nav-target="focus">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span>FOCUS</span>
    </button>
    <button class="mobile-nav-item flex flex-col items-center gap-1 cursor-pointer" data-nav-target="privacy">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span>PROFILE</span>
    </button>
  </nav>

  <!-- Global Modal Dialog & Interruption Backdrop -->
  <div id="globalModalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true">
    <div id="globalModalContent" class="modal-content glass-panel-elevated max-w-2xl w-full p-6 sm:p-8 relative">
      <div id="globalModalBody">
        <!-- Injected dynamically -->
      </div>
    </div>
  </div>

  <!-- Mobile Floating Quick-Emergency Button (Positioned safely above bottom dock) -->
  <button id="floatingEmergencyBtn" class="lg:hidden fixed bottom-20 right-4 z-40 p-3 rounded-full bg-rose-600/90 hover:bg-rose-500 text-white shadow-xl shadow-rose-900/50 border border-rose-400/40 flex items-center justify-center cursor-pointer" title="I'm Stuck Scrolling">
    <span class="sr-only">Emergency Break</span>
    <span class="text-xs font-mono font-bold">PAUSE ⚡</span>
  </button>

  <!-- ES Module Application Bootstrap -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
